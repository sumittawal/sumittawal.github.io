	<!-- GitHub Pages has no server-side rewrites, so a hard refresh or direct link to a
	     path-routed URL (e.g. /projects/some-slug) 404s unless it happens to be one of the
	     prerendered static files. public/404.html catches that 404 and redirects here with
	     the original path encoded in the query string; this script runs before the Angular
	     Router reads the URL and restores the real path via history.replaceState so routing
	     resolves correctly. Standard GitHub Pages SPA fallback technique (rafgraph/spa-github-pages). -->
	<script>
		(function () {
			var search = window.location.search;
			if (search[1] === '/') {
				var decoded = search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
				window.history.replaceState(null, '', window.location.pathname.slice(0, -1) + decoded + window.location.hash);
			}
		})();
	</script>
